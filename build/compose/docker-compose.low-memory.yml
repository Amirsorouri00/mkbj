# Demo-only override for a 1 vCPU / 2 GB VM. Swap is mandatory. This trades throughput and
# background-job isolation for a usable evaluation environment; never use it for production.
services:
  postgres:
    mem_limit: 192m
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40

  keycloak-db:
    mem_limit: 128m
    command:
      - postgres
      - -c
      - shared_buffers=24MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=24MB
      - -c
      - max_connections=30

  minio:
    # The demo catalogue import briefly takes MinIO above 192 MiB. Keep the Go heap below the
    # container ceiling so native allocations and the health-check client still have headroom.
    mem_limit: 320m
    environment:
      GOMEMLIMIT: 256MiB

  migrations:
    mem_limit: 448m
    environment:
      DOTNET_GCServer: "0"
      DOTNET_GCConserveMemory: "9"

  seed:
    mem_limit: 448m
    environment:
      DOTNET_GCServer: "0"
      DOTNET_GCConserveMemory: "9"

  api:
    mem_limit: 384m
    environment:
      # Avoid a second .NET process. Jobs run in the API for this demo tier only.
      Jobs__Mode: InProcess
      DOTNET_GCServer: "0"
      DOTNET_GCConserveMemory: "9"
    healthcheck:
      # Compose stops waiting as soon as a service becomes unhealthy. The constrained VM can
      # briefly delay dependency checks while the catalogue import settles, so allow recovery
      # within the deploy script's six-minute wait instead of failing after five probes.
      retries: 12
      start_period: 60s

  keycloak:
    mem_limit: 384m
    environment:
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx256m

  keycloak-demo-users:
    mem_limit: 256m
    environment:
      JAVA_OPTS_KC_HEAP: -Xms32m -Xmx160m

  admin-web:
    mem_limit: 64m

  shop-web:
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=160

  caddy:
    mem_limit: 64m
