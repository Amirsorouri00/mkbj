# Dev dependencies only — the API and worker run from the IDE against these.
#
# Unlike production these carry defaults, because nothing here is reachable from outside the
# machine and a developer should not need a .env to start.
name: eways-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eways
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-app-password}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-dev-migrator-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # The same roles script production uses, so the app/migrator split is exercised in dev too.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eways"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/catalog-media local/import-staging local/documents
        mc anonymous set download local/catalog-media

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    # start-dev: in-memory H2 and no TLS requirement. Never use this mode in production.
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # The realm exports substitute these; dev points them at localhost.
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-no-reply@localhost}
      KC_SMTP_USER: ${KC_SMTP_USER:-dev}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-dev}
      SHOP_REDIRECT_URI: ${SHOP_REDIRECT_URI:-http://localhost:3000/*}
      BACKOFFICE_REDIRECT_URI: ${BACKOFFICE_REDIRECT_URI:-http://localhost:5173/*}
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q 200
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pg_data:
  minio_data:
