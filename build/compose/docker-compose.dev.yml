# Dev dependencies only — the API and worker run from the IDE against these.
#
# Unlike production these carry defaults, because nothing here is reachable from outside the
# machine and a developer should not need a .env to start.
name: eways-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      # Overridable: a Postgres installed on the host wins the bind and the app silently
      # connects to the wrong server. Set POSTGRES_PORT if 5432 is taken.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: eways
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-app-password}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-dev-migrator-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # The same roles script production uses, so the app/migrator split is exercised in dev too.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eways"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes anonymously pullable images: docker.io/minio/minio and
  # quay.io/minio/minio both refuse an unauthenticated pull. MINIO_IMAGE/MINIO_MC_IMAGE default
  # to an archived mirror of the same AGPL server so `docker compose up` works with no account.
  # Point them back at minio/minio once you hold credentials — nothing else here changes, and the
  # entrypoint override below runs the same binary with the same arguments either way.
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c}
    restart: unless-stopped
    # The official image runs as root; the mirror runs as uid 1001 and cannot write a freshly
    # created named volume. Matching the official image keeps the two interchangeable.
    user: "0"
    entrypoint: ["/bin/sh", "-c", "exec $$(command -v minio || echo /opt/bitnami/minio/bin/minio) \"$$@\"", "--"]
    command: server /data --console-address :9001
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
    volumes:
      - minio_data:/data
    healthcheck:
      # The official image has mc on PATH; the mirror keeps it under /opt/bitnami.
      test: ["CMD-SHELL", "$$(command -v mc || echo /opt/bitnami/minio-client/bin/mc) ready local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_MC_IMAGE:-bitnamilegacy/minio-client:latest}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-password}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        MC=$$(command -v mc || echo /opt/bitnami/minio-client/bin/mc)
        "$$MC" alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        "$$MC" mb --ignore-existing local/catalog-media local/import-staging local/documents
        "$$MC" anonymous set download local/catalog-media

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    # start-dev: in-memory H2 and no TLS requirement. Never use this mode in production.
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # The realm exports substitute these; dev points them at localhost.
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-no-reply@localhost}
      KC_SMTP_USER: ${KC_SMTP_USER:-dev}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-dev}
      SHOP_REDIRECT_URI: ${SHOP_REDIRECT_URI:-http://localhost:3000/*}
      BACKOFFICE_REDIRECT_URI: ${BACKOFFICE_REDIRECT_URI:-http://localhost:5173/*}
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q 200
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pg_data:
  minio_data:
