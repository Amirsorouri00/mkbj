name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint, types and tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build admin and shop
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_GRAPHQL_URL: https://api.example.invalid/graphql
          VITE_KEYCLOAK_URL: https://auth.example.invalid
          NEXT_PUBLIC_MKBJ_API_GRAPHQL_URL: https://api.example.invalid/graphql
          NEXT_PUBLIC_KEYCLOAK_URL: https://auth.example.invalid
          NEXT_PUBLIC_MKBJ_MEDIA_BASE_URL: https://storage.example.invalid/catalog-media/
          MKBJ_API_GRAPHQL_URL: https://api.example.invalid/graphql
        run: pnpm build

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Mkbj.slnx

      - name: Build
        run: dotnet build Mkbj.slnx --no-restore

      # Release turns on TreatWarningsAsErrors (Directory.Build.props). This gate is
      # explicit because the Release build was broken for a long time while Debug CI
      # stayed green, so nothing surfaced the analyzer/nullability debt.
      - name: Build (Release, warnings-as-errors)
        run: dotnet build Mkbj.slnx -c Release

      # Boundary rules first — fastest signal, no DB (AGENTS.md testing notes).
      - name: Architecture tests
        run: dotnet test tests/ArchitectureTests/Mkbj.ArchitectureTests.csproj --no-build --verbosity minimal

      # The production image. ubuntu-latest has Docker, which the integration tests also need
      # for their Postgres and S3 containers.
      # ci.env holds placeholders so the production stack can be validated without secrets.
      - name: Validate the production compose stack
        run: docker compose -f build/compose/docker-compose.yml --env-file build/compose/ci.env config --quiet

      - name: Build the api image
        run: docker build -f build/docker/api.Dockerfile -t mkbj-api:ci .

      # Then everything registered in the solution. Running the SOLUTION rather than
      # naming each project means a newly added test project cannot silently skip CI —
      # which is how tests/UnitTests came to be built-but-unregistered.
      - name: All tests
        run: dotnet test Mkbj.slnx --no-build --verbosity minimal
