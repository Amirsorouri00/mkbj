schema {
  query: Query
  mutation: Mutation
}

"""
The storefront over GraphQL — the same queries the REST shop serves, for a client that would
rather ask for a page in one round trip.
"""
type Query {
  categoryAttributeAssignments(categoryId: ID!): [CategoryAttributeAssignmentSnapshot!]!
    @cost(weight: "10")
  categoryAttributeAdminRows(categoryId: ID!): [CategoryAttributeAssignmentAdminRow!]!
    @cost(weight: "10")
  effectiveCategoryAttributes(categoryId: ID!): [EffectiveCategoryAttributeSnapshot!]!
    @cost(weight: "10")
  adminProducts(
    q: String
    status: ProductStatus
    brandId: ID
    categoryId: ID
    page: Int!
    pageSize: Int!
  ): PaginatedQueryOfProductAdminRowDto! @cost(weight: "10")
  adminProduct(id: ID!): ProductAdminDetailDto! @cost(weight: "10")
  adminVariantLookup(query: String!, take: Int!): [ProductAdminVariantLookupDto!]!
    @cost(weight: "10")
  adminBrands(search: String, page: Int!, pageSize: Int!): PaginatedQueryOfBrandAdminRow!
    @cost(weight: "10")
  categories(
    filter: CategoryAdminFilterDtoInput
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): CategoriesConnection
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  category(id: ID!): CategoryAdminDto! @cost(weight: "10")
  categoryParent(categoryId: ID!): CategoryAdminDto @cost(weight: "10")
  categoryDescendants(categoryId: ID!): [CategoryAdminTreeNodeDto!]!
    @cost(weight: "10")
  categoryChildren(parentId: ID): [CategoryAdminDto!]! @cost(weight: "10")
  categoryHierarchy: [CategoryAdminTreeNodeDto!]! @cost(weight: "10")
  categoryProducts(
    categoryId: ID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): CategoryProductsConnection
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  attributeBlueprints(
    page: Int!
    pageSize: Int!
    includeDeleted: Boolean!
    filter: AttributeBlueprintFilterInput
  ): PaginatedQueryOfAttributeBlueprintSnapshot! @cost(weight: "10")
  attributeBlueprint(id: ID!): AttributeBlueprintSnapshot! @cost(weight: "10")
  attributeBlueprintUsage(id: ID!): AttributeBlueprintUsageSnapshot!
    @cost(weight: "10")
  measurementUnits: [MeasurementUnitSnapshot!]! @cost(weight: "10")
  shopHome(currency: String!): HomeDto! @cost(weight: "10")
  shopCategories: [CategoryTreeNodeDto!]! @cost(weight: "10")
  shopProducts(
    currency: String!
    filter: ShopProductFilterInput
    sort: StorefrontSort
    after: String
    first: Int
  ): ProductPageDto! @cost(weight: "10")
  shopFacets(currency: String!, categoryId: ID): FacetSetDto!
    @cost(weight: "10")
  shopProduct(slug: String!, currency: String!): ProductDetailDto!
    @cost(weight: "10")
  shopSearch(q: String!, currency: String!, after: String, first: Int): ProductPageDto!
    @cost(weight: "10")
  """
  Anonymous, like its REST twin: a storefront asks which currencies exist before a visitor
  has done anything, and requiring a token would make every page load wait on
  authentication it does not need.
  """
  currencies: [CurrencyDto!]! @cost(weight: "10")
  adminVariantPrice(variantId: ID!): VariantPriceAdminDto! @cost(weight: "10")
  adminFxRates(quote: String, page: Int!, pageSize: Int!): PaginatedQueryOfFxRateDto!
    @cost(weight: "10")
  adminFxOverrides(activeOnly: Boolean!): [FxOverrideDto!]! @cost(weight: "10")
  adminCurrencies: [CurrencyAdminDto!]! @cost(weight: "10")
  me: CustomerProfileView! @cost(weight: "10")
  adminCustomers(filter: AdminCustomerListInput): PaginatedQueryOfCustomerAdminListItem!
    @cost(weight: "10")
  adminCustomer(id: Long!): CustomerAdminDetail! @cost(weight: "10")
  adminPartners(page: Int, pageSize: Int): PaginatedQueryOfPartnerListItem!
    @cost(weight: "10")
  adminPartner(id: Long!): PartnerDetail! @cost(weight: "10")
  adminPartnerUsage(
    id: Long!
    from: DateTime
    to: DateTime
    page: Int
    pageSize: Int
  ): PaginatedQueryOfApiKeyUsageItem! @cost(weight: "10")
  adminSeller: SellerView! @cost(weight: "10")
  adminPaymentInstructions: [PaymentInstructionVersionView!]!
    @cost(weight: "10")
  adminCommerceLimits: CommerceLimitsView! @cost(weight: "10")
  cart: CartGraph! @cost(weight: "10")
  myOrders(cursor: ID, limit: Int! = 20): CursorPageOfShopOrderDto!
    @cost(weight: "10")
  order(id: ID!): ShopOrderDto! @cost(weight: "10")
  documentPdfUrl(documentId: ID!): String! @cost(weight: "10")
  adminOrders(filter: AdminOrderFilterInput): CursorPageOfAdminOrderListItemDto!
    @cost(weight: "10")
  adminOrder(id: Long!): AdminOrderDetailDto! @cost(weight: "10")
  adminDashboard: AdminDashboard! @cost(weight: "10")
  adminCustomer360(customerId: Long!, recentOrders: Int! = 20): Customer360!
    @cost(weight: "10")
  adminOrder360(orderId: Long!): Order360! @cost(weight: "10")
  adminAuditVerification: AuditVerificationView! @cost(weight: "10")
  permissions: [PermissionDto!]! @cost(weight: "10")
  permission(id: UUID!): PermissionDto @cost(weight: "10")
  permissionByCode(code: String!): PermissionDto @cost(weight: "10")
  roles: [RoleDto!]! @cost(weight: "10")
  scopes: [ScopeDto!]! @cost(weight: "10")
  userRoleScopesForUser(userId: UUID!): [UserRoleScopeDto!]! @cost(weight: "10")
}

"The administrator's acts on an order, over GraphQL."
type Mutation {
  assignCategoryAttribute(
    categoryId: ID!
    attributeBlueprintId: ID!
    isRequired: Boolean!
    isFilterable: Boolean!
    isSearchable: Boolean!
    isInTitle: Boolean!
    titleOrder: Int
    isPrimary: Boolean!
    isVariantGenerating: Boolean!
  ): CategoryAttributeAssignmentSnapshot! @cost(weight: "10")
  unassignCategoryAttribute(assignmentId: ID!): CategoryAttributeAssignmentSnapshot!
    @cost(weight: "10")
  setCategoryAttributeRequired(assignmentId: ID!, isRequired: Boolean!): CategoryAttributeAssignmentSnapshot!
    @cost(weight: "10")
  setCategoryAttributeFilterable(assignmentId: ID!, isFilterable: Boolean!): CategoryAttributeAssignmentSnapshot!
    @cost(weight: "10")
  setCategoryAttributeSearchable(assignmentId: ID!, isSearchable: Boolean!): CategoryAttributeAssignmentSnapshot!
    @cost(weight: "10")
  setCategoryAttributeTitleConfiguration(
    assignmentId: ID!
    isInTitle: Boolean!
    titleOrder: Int
  ): CategoryAttributeAssignmentSnapshot! @cost(weight: "10")
  reorderCategoryAttribute(assignmentId: ID!, titleOrder: Int!): CategoryAttributeAssignmentSnapshot!
    @cost(weight: "10")
  setCategoryAttributePrimary(assignmentId: ID!, isPrimary: Boolean!): CategoryAttributeAssignmentSnapshot!
    @cost(weight: "10")
  setCategoryAttributeVariantGenerating(
    assignmentId: ID!
    isVariantGenerating: Boolean!
  ): CategoryAttributeAssignmentSnapshot! @cost(weight: "10")
  excludeInheritedCategoryAttribute(
    categoryId: ID!
    sourceAssignmentId: ID!
  ): CategoryAttributeExclusionSnapshot! @cost(weight: "10")
  includeInheritedCategoryAttribute(
    categoryId: ID!
    sourceAssignmentId: ID!
  ): CategoryAttributeExclusionSnapshot! @cost(weight: "10")
  setCategoryAttributeExclusions(
    categoryId: ID!
    excludedSourceAssignmentIds: [ID!]!
  ): [CategoryAttributeExclusionSnapshot!]! @cost(weight: "10")
  createProduct(input: CreateProductInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  updateProduct(input: UpdateProductInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  setProductSecondaryCategories(input: SetProductSecondaryCategoriesInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  addVariant(input: AddVariantInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  setVariantActive(input: SetVariantActiveInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  addProductIdentifier(input: AddProductIdentifierInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  removeProductIdentifier(input: RemoveProductIdentifierInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  setProductActive(input: SetProductActiveInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  uploadProductMedia(input: UploadProductMediaInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  removeProductMedia(input: RemoveProductMediaInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  bulkEditProducts(input: BulkEditProductsInput!): BulkEditResult!
    @cost(weight: "10")
  mergeDuplicateProduct(input: MergeDuplicateProductInput!): ProductAdminDetailDto!
    @cost(weight: "10")
  createBrand(displayName: String!, aliases: [String!]): ID! @cost(weight: "10")
  renameBrand(brandId: ID!, displayName: String!): Boolean! @cost(weight: "10")
  setBrandAliases(brandId: ID!, aliases: [String!]!): Boolean!
    @cost(weight: "10")
  setBrandActive(brandId: ID!, active: Boolean!): Boolean! @cost(weight: "10")
  createCategory(input: CreateCategoryInput!): ID! @cost(weight: "10")
  updateCategory(input: UpdateCategoryInput!): CategoryAdminDto!
    @cost(weight: "10")
  setCategoryStatus(input: SetCategoryStatusInput!): CategoryAdminDto!
    @cost(weight: "10")
  moveCategory(input: MoveCategoryInput!): Boolean! @cost(weight: "10")
  deactivateCategories(input: BulkDeactivateCategoriesInput!): Boolean!
    @cost(weight: "10")
  deleteCategory(input: CategoryIdInput!): Boolean! @cost(weight: "10")
  assignCategoryProduct(input: AssignCategoryProductInput!): Boolean!
    @cost(weight: "10")
  unassignCategoryProduct(input: UnassignCategoryProductInput!): Boolean!
    @cost(weight: "10")
  createAttributeBlueprint(input: CreateAttributeBlueprintInput!): ID!
    @cost(weight: "10")
  updateAttributeBlueprint(input: UpdateAttributeBlueprintInput!): Boolean!
    @cost(weight: "10")
  addAttributeBlueprintOption(input: AddAttributeBlueprintOptionInput!): ID!
    @cost(weight: "10")
  updateAttributeBlueprintOption(input: UpdateAttributeBlueprintOptionInput!): Boolean!
    @cost(weight: "10")
  removeAttributeBlueprintOption(attributeBlueprintId: ID!, optionId: ID!): Boolean!
    @cost(weight: "10")
  renameAttributeBlueprint(attributeBlueprintId: Long!, newName: String!): Boolean!
    @cost(weight: "10")
  changeAttributeBlueprintDataType(
