  setAttributeBlueprintScope(input: SetAttributeBlueprintScopeInput!): Boolean!
    @cost(weight: "10")
  setAttributeBlueprintAliases(input: SetAttributeBlueprintAliasesInput!): Boolean!
    @cost(weight: "10")
  setAttributeBlueprintUnit(input: SetAttributeBlueprintUnitInput!): Boolean!
    @cost(weight: "10")
  deleteAttributeBlueprint(attributeBlueprintId: Long!): Boolean!
    @cost(weight: "10")
  setVariantPrice(input: SetVariantPriceInput!): Boolean! @cost(weight: "10")
  setCurrencyOverride(input: SetCurrencyOverrideInput!): Boolean!
    @cost(weight: "10")
  removeCurrencyOverride(input: RemoveCurrencyOverrideInput!): Boolean!
    @cost(weight: "10")
  setFxOverride(input: SetFxOverrideInput!): ID! @cost(weight: "10")
  clearFxOverride(input: ClearFxOverrideInput!): Boolean! @cost(weight: "10")
  setCurrencyEnabled(input: SetCurrencyEnabledInput!): Boolean!
    @cost(weight: "10")
  requestFxRefresh: Boolean! @cost(weight: "10")
  updateProfile(input: UpdateProfileInput!): CustomerProfileView!
    @cost(weight: "10")
  suspendCustomer(id: Long!): Boolean! @cost(weight: "10")
  reactivateCustomer(id: Long!): Boolean! @cost(weight: "10")
  createPartner(
    name: String!
    scopes: [String!]!
    rateLimitPerMinute: Int
    bulkMaxItems: Int
  ): Long! @cost(weight: "10")
  suspendPartner(id: Long!): Boolean! @cost(weight: "10")
  reactivatePartner(id: Long!): Boolean! @cost(weight: "10")
  setPartnerScopes(id: Long!, scopes: [String!]!): Boolean! @cost(weight: "10")
  setPartnerLimits(id: Long!, rateLimitPerMinute: Int!, bulkMaxItems: Int!): Boolean!
    @cost(weight: "10")
  issuePartnerApiKey(id: Long!, scopes: [String!], expiresAt: DateTime): IssuedApiKeyPayload!
