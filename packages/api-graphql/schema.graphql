  addToCart(input: AddToCartInput!): CartGraph! @cost(weight: "10")
  updateCartLine(input: UpdateCartLineInput!): CartGraph! @cost(weight: "10")
  removeCartLine(input: RemoveCartLineInput!): CartGraph! @cost(weight: "10")
  setCartCurrency(input: SetCartCurrencyInput!): CartGraph! @cost(weight: "10")
  checkout(input: CheckoutInput!): CheckoutPayload! @cost(weight: "10")
  confirmOrderPayment(input: ConfirmOrderPaymentInput!): AdminOrderDetailDto!
    @cost(weight: "10")
  cancelOrder(input: CancelOrderInput!): AdminOrderDetailDto!
    @cost(weight: "10")
  refundOrder(input: RefundOrderInput!): AdminOrderDetailDto!
    @cost(weight: "10")
  createPermission(input: CreatePermissionInput!): CreatePermissionPayload!
    @cost(weight: "10")
  updatePermission(input: UpdatePermissionInput!): UpdatePermissionPayload!
    @cost(weight: "10")
  deletePermission(input: DeletePermissionInput!): DeletePermissionPayload!
    @cost(weight: "10")
  createRole(input: CreateRoleInput!): CreateRolePayload! @cost(weight: "10")
  updateRole(input: UpdateRoleInput!): UpdateRolePayload! @cost(weight: "10")
  deleteRole(input: DeleteRoleInput!): DeleteRolePayload! @cost(weight: "10")
  createScope(input: CreateScopeInput!): CreateScopePayload! @cost(weight: "10")
  updateScope(input: UpdateScopeInput!): UpdateScopePayload! @cost(weight: "10")
  deleteScope(input: DeleteScopeInput!): DeleteScopePayload! @cost(weight: "10")
  bootstrapAdmin(input: BootstrapAdminInput!): BootstrapAdminPayload!
    @cost(weight: "10")
  assignUserRoleScope(input: AssignUserRoleScopeInput!): AssignUserRoleScopePayload!
    @cost(weight: "10")
  removeUserRoleScope(input: RemoveUserRoleScopeInput!): RemoveUserRoleScopePayload!
    @cost(weight: "10")
}

