}

query AdminCategories(
    $filter: CategoryAdminFilterDtoInput
    $first: Int
    $after: String
    $last: Int
    $before: String
) {
    categories(filter: $filter, first: $first, after: $after, last: $last, before: $before) {
        totalCount
        pageInfo {
            hasNextPage
            hasPreviousPage
            startCursor
            endCursor
        }
        nodes {
            id
            parentId
            name
            slug
            description
            displayOrder
            status
            parent {
                id
                name
            }
            childCount
        }
    }
}

