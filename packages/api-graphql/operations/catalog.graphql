query AdminProducts(
    $q: String
    $status: ProductStatus
    $brandId: ID
    $categoryId: ID
    $page: Int!
    $pageSize: Int!
) {
    adminProducts(
        q: $q
        status: $status
        brandId: $brandId
        categoryId: $categoryId
        page: $page
        pageSize: $pageSize
    ) {
        page
        pageSize
        pageCount
        totalCount
        items {
            id
            title
            slug
            status
            deactivatedByAdmin
            brandId
            brandName
            primaryCategoryId
            primaryCategoryName
            mpn
            variantCount
            activeVariantCount
            hasUsableImage
            mergedIntoProductId
            createdAt
            updatedAt
        }
    }
}

query AdminProduct($id: ID!) {
    adminProduct(id: $id) {
        ...ProductDetailFields
    }
}

query AdminVariantLookup($query: String!, $take: Int!) {
    adminVariantLookup(query: $query, take: $take) {
        variantId
        productId
        productTitle
        brandName
        categoryName
        sku
        attributeValues {
            key
            value
        }
        isActive
    }
}

query ProductEditorOptions($brandPage: Int!, $brandPageSize: Int!) {
    adminBrands(page: $brandPage, pageSize: $brandPageSize) {
        items {
            id
            displayName
            isActive
        }
    }
    categoryHierarchy {
        id
        name
        status
        children {
            id
            name
            status
            children {
                id
                name
                status
                children {
                    id
                    name
                    status
                    children {
                        id
                        name
                        status
                    }
                }
            }
        }
    }
}

query ProductCategoryAttributeRules(
    $categoryId: ID!
    $attributePage: Int!
    $attributePageSize: Int!
) {
    effectiveCategoryAttributes(categoryId: $categoryId) {
        attributeBlueprintId
        attributeBlueprintName
        isExcluded
        isRequired
        isVariantGenerating
        isInherited
    }
    attributeBlueprints(page: $attributePage, pageSize: $attributePageSize, includeDeleted: false) {
        items {
            id
            name
            canonicalKey
            dataType
            status
            options {
                id
                value
            }
        }
    }
}

