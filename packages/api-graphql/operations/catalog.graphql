fragment ProductDetailFields on ProductAdminDetailDto {
    id
    title
    slug
    shortDescription
    description
    status
    deactivatedByAdmin
    brandId
    brandName
    primaryCategoryId
    primaryCategoryName
    secondaryCategoryIds
    mpn
    mergedIntoProductId
    sourceRefs
    activationProblems
    createdAt
    updatedAt
    variants {
        id
        sku
        attributeSignature
        attributeValues {
            key
            value
        }
        isActive
        deactivatedByAdmin
    }
    identifiers {
        id
        type
        value
        sourceDomain
    }
    media {
        id
        objectKey
        url
        sortOrder
        alt
        usageRights
        isUsable
    }
}

query AdminBrands($search: String, $page: Int!, $pageSize: Int!) {
    adminBrands(search: $search, page: $page, pageSize: $pageSize) {
        page
        pageSize
        pageCount
        totalCount
        items {
            id
            canonicalName
            displayName
            provenance
            isActive
            aliases
            createdAt
            updatedAt
        }
    }
}

mutation CreateAdminBrand($displayName: String!, $aliases: [String!]) {
    createBrand(displayName: $displayName, aliases: $aliases)
}

mutation RenameAdminBrand($brandId: ID!, $displayName: String!) {
