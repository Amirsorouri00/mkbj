query CategoryAttributeManagement(
    $categoryId: ID!
    $categoryGraphId: ID!
    $attributePage: Int!
    $attributePageSize: Int!
    $attributeFilter: AttributeBlueprintFilterInput
) {
    category(id: $categoryGraphId) {
        id
        name
        slug
        status
    }
    effectiveCategoryAttributes(categoryId: $categoryId) {
        assignmentId
        sourceCategoryId
        attributeBlueprintId
        attributeBlueprintName
        isInherited
        isExcluded
        isRequired
        isFilterable
        isSearchable
        isInTitle
        titleOrder
        isPrimary
        isVariantGenerating
    }
    attributeBlueprints(
        page: $attributePage
        pageSize: $attributePageSize
        includeDeleted: false
        filter: $attributeFilter
    ) {
        items {
            id
            name
            dataType
            status
            scope
            scopeCategoryId
        }
    }
}

mutation AssignAdminCategoryAttribute(
    $categoryId: ID!
    $attributeBlueprintId: ID!
    $isRequired: Boolean!
    $isFilterable: Boolean!
    $isSearchable: Boolean!
    $isInTitle: Boolean!
    $titleOrder: Int
    $isPrimary: Boolean!
    $isVariantGenerating: Boolean!
) {
    assignCategoryAttribute(
        categoryId: $categoryId
        attributeBlueprintId: $attributeBlueprintId
        isRequired: $isRequired
        isFilterable: $isFilterable
        isSearchable: $isSearchable
        isInTitle: $isInTitle
        titleOrder: $titleOrder
        isPrimary: $isPrimary
        isVariantGenerating: $isVariantGenerating
    ) {
        id
    }
}

