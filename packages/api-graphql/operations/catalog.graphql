query AdminAttributeBlueprints(
    $page: Int!
    $pageSize: Int!
    $includeDeleted: Boolean!
    $filter: AttributeBlueprintFilterInput
) {
    attributeBlueprints(
        page: $page
        pageSize: $pageSize
        includeDeleted: $includeDeleted
        filter: $filter
    ) {
        page
        pageSize
        pageCount
        totalCount
        items {
            id
            scopeCategoryId
            unitId
            name
            canonicalKey
            dataType
            status
            scope
            aliases
            deletedAt
            createdAt
            updatedAt
            options {
                id
                measurementUnitId
                value
            }
        }
    }
    measurementUnits {
        id
        name
        symbol
    }
}

